name: Bug Report
description: Create a report to help us fix issues with reMarkable to OneNote Web Extension
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible so we can reproduce and fix the issue.

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      description: What version of the extension are you running? (e.g., v1.2.1)
      placeholder: v1.2.1
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you running the extension in?
      options:
        - Google Chrome
        - Microsoft Edge
        - Mozilla Firefox
        - Opera
        - Brave / Vivaldi / Other Chromium-based browser
        - Other Gecko / Firefox-based browser
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser Version & Operating System
      description: Please share your browser version and operating system (e.g., Chrome 131 on Windows 11).
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the extension is affected?
      options:
        - reMarkable Cloud Auth / Pairing
        - Microsoft OneNote Auth / Graph API
        - File Browser / Sync15 Folder Loading
        - Notebook / Ink / PDF Conversion
        - Sync Engine / Auto-Sync Alarms
        - Profile Storage / IndexedDB / Backup
        - Options UI / Popup / Tour
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Observe status / error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Please attach screenshots or paste errors from the extension background service worker / event page DevTools console (ensure no personal tokens are included).

